# -------------------------------------------------------------------
# هاوڕێ — اجرای Production با Docker Compose
#
#   ۱) cp .env.production.example .env.production   و مقادیر را پر کنید
#   ۲) docker compose up -d --build
#   ۳) برنامه روی http://localhost:3000 بالا می‌آید
#
# برای انتشار روی دامنه، سرویس nginx را با پروفایل proxy فعال کنید:
#   docker compose --profile proxy up -d --build
# -------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hawre:latest
    container_name: hawre-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # دیتابیس و آپلودها روی والیوم پایدار نگه‌داری می‌شوند
      DATABASE_URL: "file:/app/data/hawre.db"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      - hawre-data:/app/data
      - hawre-uploads:/app/public/uploads
    ports:
      # اگر از nginx استفاده می‌کنید این خط را حذف کنید تا پورت روی اینترنت باز نشود
      - "3000:3000"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    container_name: hawre-nginx
    restart: unless-stopped
    profiles: ['proxy']
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro

volumes:
  hawre-data:
  hawre-uploads:
