# -------------------------------------------------------------------
# پیکربندی نمونه Nginx برای هاوڕێ
# «example.com» را با دامنه خود جایگزین کنید.
#
# دریافت گواهی HTTPS (یک‌بار، پیش از فعال‌کردن بلاک ۴۴۳):
#   docker run --rm -v "$PWD/docker/certbot/conf:/etc/letsencrypt" \
#     -v "$PWD/docker/certbot/www:/var/www/certbot" \
#     certbot/certbot certonly --webroot -w /var/www/certbot -d example.com
# -------------------------------------------------------------------

upstream hawre_app {
    server app:3000;
    keepalive 32;
}

# --- HTTP: تأیید Certbot + هدایت به HTTPS ---
server {
    listen 80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
# تا پیش از دریافت گواهی، این بلاک را کامنت کنید و روی HTTP کار کنید.
server {
    listen 443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # امنیت پایه (هدرهای برنامه‌ای در خود Next.js هم تنظیم شده‌اند)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6m;   # سقف آپلود عکس پروفایل

    # فایل‌های ساکن نکست: کش طولانی
    location /_next/static/ {
        proxy_pass http://hawre_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://hawre_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
